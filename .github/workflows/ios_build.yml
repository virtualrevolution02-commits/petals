name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: CocoaPods Install
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS No-Codesign (.app for Simulator / Cloud Test)
        run: flutter build ios --release --no-codesign

      - name: Zip iOS App Bundle
        run: |
          cd build/ios/iphoneos
          zip -r Petals_iOS_App.zip Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petals_iOS_App
          path: build/ios/iphoneos/Petals_iOS_App.zip
