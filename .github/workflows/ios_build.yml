name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager & Clean
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: CocoaPods Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Flutter Frameworks
        run: flutter build ios --release --no-codesign || true

      - name: Build iOS App via xcodebuild (No Codesign Override)
        run: |
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SYMROOT="${GITHUB_WORKSPACE}/build/ios"
          cd ..

      - name: Create Sideloadable IPA Package
        run: |
          mkdir -p build/ios/iphoneos/Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            exit 1
          fi
          cp -r "$APP_PATH" build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r "${GITHUB_WORKSPACE}/Petals_iOS_App.ipa" Payload
          ls -lh "${GITHUB_WORKSPACE}/Petals_iOS_App.ipa"

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petals_iOS_IPA
          path: Petals_iOS_App.ipa
