name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: CocoaPods Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Disable Code Signing in Xcode Project
        run: |
          cd ios
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*"/CODE_SIGN_IDENTITY = ""/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = .*;/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          # Add CODE_SIGNING_REQUIRED = NO and CODE_SIGNING_ALLOWED = NO
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/&\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' Runner.xcodeproj/project.pbxproj
          cd ..

      - name: Build iOS No-Codesign
        run: |
          flutter build ios --release --no-codesign

      - name: Zip iOS App Bundle
        run: |
          cd build/ios/iphoneos
          zip -r Petals_iOS_App.zip Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petals_iOS_App
          path: build/ios/iphoneos/Petals_iOS_App.zip
