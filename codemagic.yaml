workflows:
  ios-release-workflow:
    name: Petals iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # --- Code Signing (Uncomment when App Store Connect API Key is added in Codemagic) ---
      # ios_signing:
      #   distribution_type: ad_hoc  # Use 'app_store' for TestFlight/App Store, 'ad_hoc' for direct device install
      #   bundle_identifier: com.bharathi.petals
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter & CocoaPods dependencies
        script: |
          flutter pub get
          cd ios && pod install
      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r petals_unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true


