name: petals
description: "Petals - A private couple moments sharing app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Auth
  google_sign_in: ^6.2.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.4
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6

  # Widget (home screen)
  home_widget: ^0.7.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # UI & Animations
  google_fonts: ^6.2.1
  lottie: ^3.1.3
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # State & Utils
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
